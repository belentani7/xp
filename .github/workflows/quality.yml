name: XP Installer Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate Bash syntax
        run: bash -n install.sh && bash -n hooks/post-commit && bash -n hooks/post-merge
      - name: Validate Python sources
        run: python3 -m compileall -q engine && python3 -m py_compile setup.py
      - name: Exercise installer and Git hooks
        run: python3 -m unittest discover -s tests -v
      - name: Verify explicit opt-in for global hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          script = Path('install.sh').read_text()
          assert 'XP_INSTALL_GLOBAL_HOOKS:-0' in script
          assert 'os.environ["XP_HOME"]' in script
          assert 'git config --global core.hooksPath' in script
          PY
