<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="xpbar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9333ea"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="280" height="80" rx="12" fill="url(#bg)" stroke="#9333ea" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Inner border glow -->
  <rect x="3" y="3" width="274" height="74" rx="10" fill="none" stroke="#9333ea" stroke-width="0.5" opacity="0.3"/>

  <!-- XP Logo/Icon -->
  <g transform="translate(16, 16)" filter="url(#neon)">
    <text font-family="monospace" font-weight="bold" font-size="28" fill="#00ff88">⚔️</text>
  </g>

  <!-- XP Text -->
  <text x="52" y="30" font-family="'SF Mono', 'Fira Code', monospace" font-weight="bold" font-size="14" fill="#e0e0e0">
    XP TERMINAL RPG
  </text>

  <!-- Level -->
  <text x="52" y="48" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#a855f7">
    Level {{LEVEL}}
  </text>

  <!-- XP Count -->
  <text x="52" y="63" font-family="'SF Mono', 'Fira Code', monospace" font-size="10" fill="#9ca3af">
    {{XP}} XP
  </text>

  <!-- XP Progress Bar Background -->
  <rect x="140" y="38" width="120" height="8" rx="4" fill="#1a1a2e" stroke="#374151" stroke-width="0.5"/>

  <!-- XP Progress Bar Fill -->
  <rect x="140" y="38" width="{{BAR_WIDTH}}" height="8" rx="4" fill="url(#xpbar)">
    <animate attributeName="width" from="0" to="{{BAR_WIDTH}}" dur="1s" fill="freeze"/>
  </rect>

  <!-- Progress percentage -->
  <text x="142" y="62" font-family="'SF Mono', 'Fira Code', monospace" font-size="9" fill="#9ca3af">
    {{PERCENT}}%
  </text>

  <!-- Class icon -->
  <text x="240" y="30" font-family="sans-serif" font-size="16">
    {{CLASS_ICON}}
  </text>

  <!-- Streak fire -->
  <g transform="translate(240, 48)">
    <text font-family="sans-serif" font-size="10" fill="#f59e0b">{{STREAK}}🔥</text>
  </g>
</svg>
